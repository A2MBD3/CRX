<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#160b2b">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="refresh" content="5;url=https://shop.crxmod.top/">
  <title>CRX MODS — We Have Moved</title>
  <link rel="preload" as="image" href="banner.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" style="background-image:url('banner.png')"></div>
  <div class="vignette"></div>
  <canvas id="petals" aria-hidden="true"></canvas>

  <main class="stage">
    <a class="card" href="https://shop.crxmod.top/" aria-label="Visit the new CRX MODS shop">
      <img class="banner" src="banner.png" alt="CRX MODS has moved. New domain: crxmod.top. New shop: shop.crxmod.top. Former domain: crxmod.pages.dev." width="1672" height="941">
      <span class="shine"></span>
    </a>

    <div class="bar" role="status" aria-live="polite">
      <div class="bar-text">
        <span>Redirecting in <strong id="countdown">5</strong>s</span>
        <button id="cancel" type="button">Stay here</button>
      </div>
      <div class="track"><i id="fill"></i></div>
      <a class="cta" href="https://shop.crxmod.top/">Open shop now →</a>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
